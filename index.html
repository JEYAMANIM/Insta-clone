<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>Instagram Clone • Photos, Stories, and Reels</title>
    <meta name="title" content="Instagram Clone • Photos, Stories, and Reels" />

    <meta property="og:type" content="website" />

    <meta property="og:title" content="Instagram Clone • Photos, Stories, and Reels" />
